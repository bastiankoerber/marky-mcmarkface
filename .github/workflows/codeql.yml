name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # GitHub Code Security is unavailable to this private GitHub Free repository. The workflow
    # becomes active automatically after the repository is made public, and can then be started
    # immediately with workflow_dispatch instead of waiting for the weekly schedule.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level map, so this must be repeated here for
      # private-repository checkout. It remains correct after the repository becomes public.
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
