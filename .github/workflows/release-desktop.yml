name: Release macOS installer

on:
  release:
    types: [published]

concurrency:
  group: desktop-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos-arm64:
    name: Build macOS ARM64 installer
    runs-on: macos-14
    timeout-minutes: 45
    environment: release

    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./packages/desktop/package.json').version")"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match desktop version $package_version."
            echo "Set packages/desktop/package.json to $release_version before creating the release."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Apple signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for value in \
            "$MACOS_CERTIFICATE_BASE64" \
            "$MACOS_CERTIFICATE_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_APP_SPECIFIC_PASSWORD" \
            "$APPLE_TEAM_ID"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done

          if [[ "$present" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not configured. This release will be ad-hoc signed and not notarized."
            echo "### ⚠️ Unsigned macOS release" >> "$GITHUB_STEP_SUMMARY"
            echo "The installer was built without a stable Developer ID or Apple notarization." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$present" -ne 5 ]]; then
            echo "::error::Apple signing is only partially configured. Add all five release environment secrets or remove all of them."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "### Signed macOS release" >> "$GITHUB_STEP_SUMMARY"
            echo "The app and installer will be Developer ID signed and notarized by Apple." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/marky-developer-id.p12"
          keychain_path="$RUNNER_TEMP/marky-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          echo "MARKY_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Test and typecheck
        run: |
          pnpm typecheck
          pnpm test

      - name: Build installer
        env:
          MARKY_RELEASE_SIGNING: ${{ steps.signing.outputs.enabled }}
        run: pnpm desktop:make

      - name: Notarize and staple disk image
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find packages/desktop/out/make -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail
          app_path="packages/desktop/out/Marky McMarkface-darwin-arm64/Marky McMarkface.app"
          dmg_path="$(find packages/desktop/out/make -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"
          pnpm -C packages/desktop exec electron-fuses read --app \
            "out/Marky McMarkface-darwin-arm64/Marky McMarkface.app"

          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$app_path"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/desktop/package.json').version")"
          dmg_path="$(find packages/desktop/out/make -maxdepth 1 -name '*.dmg' -print -quit)"
          zip_path="$(find packages/desktop/out/make/zip -name '*.zip' -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"
          mkdir -p release-assets

          suffix=""
          if [[ "${{ steps.signing.outputs.enabled }}" != "true" ]]; then
            suffix="-UNSIGNED"
            cat > release-assets/UNSIGNED-BUILD.txt <<'EOF'
          This installer is ad-hoc signed and has not been notarized by Apple.
          It is intended for development and evaluation, not as a polished public distribution.
          Its signing identity is not stable across rebuilds, so macOS may show Gatekeeper or
          repeated Keychain prompts after updates.
          EOF
          fi

          cp "$dmg_path" "release-assets/Marky-McMarkface-${version}-arm64${suffix}.dmg"
          cp "$zip_path" "release-assets/Marky-McMarkface-${version}-arm64${suffix}.zip"
          cd release-assets
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marky-McMarkface-${{ github.event.release.tag_name }}-macos-arm64
          path: release-assets/
          if-no-files-found: error

      - name: Attach installer to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/* \
            --repo "${{ github.repository }}"

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$MARKY_SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/marky-developer-id.p12"
